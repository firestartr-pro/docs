baseURL = 'https://docs.firestartr.dev/docs/'
languageCode = 'en-us'
title = 'Firestartr Documentation'
disablePathToLower = true

[module]
  [module.hugoVersion]
    extended = true
    min = '0.152.2'
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[menu]
  [[menu.main]]
    name = 'Search'
    weight = 5
    [menu.main.params]
      type = 'search'
  [[menu.main]]
    name = 'Theme'
    weight = 6
    [menu.main.params]
      type = 'theme-toggle'

[params]
  displayUpdatedDate = false

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = 'images/logo.png'
      width = 20
      height = 20

  [params.theme]
    default = 'light'
    displayToggle = true

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      index = 'content'
      tokenize = 'forward'

  [params.editURL]
    enable = false

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
